<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acuerdo con firma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EEF1F4; --paper:#FFFFFF; --ink:#1B2430; --muted:#5B6675;
  --line:#CBD3DD; --accent:#1F4E79; --accent-ink:#FFFFFF;
  --ok:#1E7A4C; --ok-bg:#E6F4EC; --err:#B3261E; --err-bg:#FBEAE8;
  --pad-bg:#FFFFFF; --pad-ink:#0F1B2D; --pad-guide:#9AA7B6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#12161C; --paper:#1A2029; --ink:#E4E9F0; --muted:#9AA5B4;
    --line:#333D4A; --accent:#7FB0E0; --accent-ink:#0E1620;
    --ok:#6FD19E; --ok-bg:#15291F; --err:#F2968F; --err-bg:#2E1716;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#12161C; --paper:#1A2029; --ink:#E4E9F0; --muted:#9AA5B4;
  --line:#333D4A; --accent:#7FB0E0; --accent-ink:#0E1620;
  --ok:#6FD19E; --ok-bg:#15291F; --err:#F2968F; --err-bg:#2E1716;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;padding:32px 16px 56px}
.sheet{max-width:760px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:clamp(22px,5vw,48px);display:grid;gap:28px}
header{display:grid;gap:6px;border-bottom:1px solid var(--line);padding-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:clamp(24px,4vw,30px);line-height:1.2;margin:0;text-wrap:balance}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.body-text{font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.65;max-width:65ch}
.placeholder{border:1px dashed var(--line);border-radius:4px;padding:18px;color:var(--muted);font-family:"IBM Plex Sans",sans-serif;font-size:14px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--muted);font-weight:600}
form{display:grid;gap:20px}
.row{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
.field{display:grid;gap:6px}
label{font-size:14px;font-weight:500}
.hint{font-size:12.5px;color:var(--muted)}
input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%}
#rut{font-family:"IBM Plex Mono",ui-monospace,monospace;letter-spacing:.02em}
input[type=text]:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
input[aria-invalid=true]{border-color:var(--err)}
.msg{font-size:12.5px;color:var(--err);min-height:1em}
.msg.good{color:var(--ok)}
.sig-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.pad-wrap{position:relative;border:1px solid var(--line);border-radius:4px;background:var(--pad-bg);overflow:hidden}
canvas{display:block;width:100%;height:200px;touch-action:none;cursor:crosshair}
.pad-line{position:absolute;left:24px;right:24px;bottom:44px;border-bottom:1px solid var(--pad-guide);pointer-events:none}
.pad-x{position:absolute;left:24px;bottom:48px;font-family:"Source Serif 4",serif;font-size:20px;color:var(--pad-guide);pointer-events:none}
.pad-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--pad-guide);font-size:14px;pointer-events:none}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:500;font-size:15px;border-radius:4px;padding:10px 18px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.link{border:none;background:none;padding:4px 0;color:var(--accent);font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
.done{display:grid;gap:14px;background:var(--ok-bg);border:1px solid var(--ok);border-radius:4px;padding:18px}
.done strong{color:var(--ok)}
.summary{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px}
.summary dt{color:var(--muted)}
.summary dd{margin:0;font-variant-numeric:tabular-nums}
.summary img{max-width:260px;width:100%;background:#fff;border:1px solid var(--line);border-radius:3px}
.form-err{background:var(--err-bg);color:var(--err);border-radius:4px;padding:10px 12px;font-size:14px}
</style>
</head>
<body>


<main class="sheet">
  <header>
    <span class="eyebrow">Acuerdo entre partes</span>
    <h1>Acuerdo de colaboración</h1>
    <span class="meta">Fecha: <span id="fecha"></span></span>
  </header>

  <section class="body-text">
    <div class="placeholder">Aquí irá el texto del acuerdo. Cuando lo envíes, se incorpora en esta sección con sus cláusulas.</div>
  </section>

  <section id="firmaSec" style="display:grid;gap:18px">
    <h2>Firma del compareciente</h2>

    <form id="f" novalidate>
      <div class="row">
        <div class="field">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" autocomplete="name" placeholder="Nombre y apellidos">
          <span class="msg" id="nombreMsg"></span>
        </div>
        <div class="field">
          <label for="rut">RUT</label>
          <input type="text" id="rut" inputmode="text" autocomplete="off" placeholder="12.345.678-5" maxlength="12">
          <span class="msg" id="rutMsg"></span>
        </div>
      </div>

      <div class="field">
        <div class="sig-head">
          <label id="firmaLbl">Firma</label>
          <button type="button" class="link" id="limpiar">Borrar firma</button>
        </div>
        <div class="pad-wrap">
          <canvas id="pad" aria-labelledby="firmaLbl" role="img"></canvas>
          <div class="pad-line"></div>
          <div class="pad-x">×</div>
          <div class="pad-empty" id="padEmpty">Firme aquí con el mouse o el dedo</div>
        </div>
        <span class="msg" id="firmaMsg"></span>
      </div>

      <label class="check" for="acepto">
        <input type="checkbox" id="acepto">
        <span>Declaro haber leído el acuerdo y estar conforme con su contenido.</span>
      </label>

      <div class="form-err" id="formErr" hidden></div>

      <div class="actions">
        <button type="submit" class="primary" id="firmar">Firmar acuerdo</button>
      </div>
    </form>

    <div class="done" id="done" hidden>
      <div><strong>Acuerdo firmado.</strong> Revise los datos registrados.</div>
      <dl class="summary">
        <dt>Nombre</dt><dd id="sNombre"></dd>
        <dt>RUT</dt><dd id="sRut"></dd>
        <dt>Fecha</dt><dd id="sFecha"></dd>
        <dt>Firma</dt><dd><img id="sFirma" alt="Firma registrada"></dd>
      </dl>
      <div class="actions">
        <button type="button" id="descargar" hidden>Descargar comprobante (PNG)</button>
        <button type="button" class="link" id="editar">Corregir datos</button>
      </div>
      <span class="msg" id="dlMsg"></span>
    </div>
  </section>
</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const hoy = new Date();
  const fechaTxt = hoy.toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'});
  $('fecha').textContent = fechaTxt;

  /* ---------- RUT ---------- */
  function limpiarRut(v){ return v.replace(/[^0-9kK]/g,'').toUpperCase(); }
  function formatearRut(v){
    const c = limpiarRut(v); if(c.length<2) return c;
    const cuerpo = c.slice(0,-1), dv = c.slice(-1);
    return cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g,'.') + '-' + dv;
  }
  function rutValido(v){
    const c = limpiarRut(v); if(c.length<8) return false;
    const cuerpo = c.slice(0,-1), dv = c.slice(-1);
    if(!/^\d+$/.test(cuerpo)) return false;
    let s=0,m=2;
    for(let i=cuerpo.length-1;i>=0;i--){ s+= +cuerpo[i]*m; m = m===7?2:m+1; }
    const r = 11-(s%11);
    const esp = r===11?'0':r===10?'K':String(r);
    return esp===dv;
  }
  const rut=$('rut'), rutMsg=$('rutMsg');
  rut.addEventListener('input',()=>{
    rut.value = formatearRut(rut.value);
    rut.removeAttribute('aria-invalid'); rutMsg.textContent=''; rutMsg.className='msg';
    if(limpiarRut(rut.value).length>=8 && rutValido(rut.value)){ rutMsg.textContent='RUT válido'; rutMsg.className='msg good'; }
  });
  rut.addEventListener('blur',()=>{
    if(rut.value && !rutValido(rut.value)){ rut.setAttribute('aria-invalid','true'); rutMsg.textContent='El dígito verificador no coincide. Revise el RUT.'; rutMsg.className='msg'; }
  });

  /* ---------- Firma ---------- */
  const pad=$('pad'), ctx=pad.getContext('2d');
  let dibujando=false, hayTrazo=false, ultimo=null, trazos=[];
  function ajustar(){
    const r=pad.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    pad.width=Math.round(r.width*dpr); pad.height=Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0F1B2D';
    redibujar();
  }
  function redibujar(){
    const r=pad.getBoundingClientRect();
    ctx.clearRect(0,0,r.width,r.height);
    for(const t of trazos){
      for(let i=1;i<t.length;i++){ linea(t[i-1],t[i]); }
      if(t.length===1){ punto(t[0]); }
    }
  }
  function pos(e){ const r=pad.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure&&e.pointerType!=='mouse'?e.pressure:0.5}; }
  function linea(a,b){ ctx.lineWidth=1.4+b.p*2.2; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
  function punto(a){ ctx.beginPath(); ctx.arc(a.x,a.y,1.6,0,Math.PI*2); ctx.fillStyle='#0F1B2D'; ctx.fill(); }
  pad.addEventListener('pointerdown',e=>{
    e.preventDefault(); pad.setPointerCapture(e.pointerId);
    dibujando=true; ultimo=pos(e); trazos.push([ultimo]); punto(ultimo);
    if(!hayTrazo){ hayTrazo=true; $('padEmpty').hidden=true; $('firmaMsg').textContent=''; }
  });
  pad.addEventListener('pointermove',e=>{
    if(!dibujando) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for(const ev of evs){ const p=pos(ev); linea(ultimo,p); trazos[trazos.length-1].push(p); ultimo=p; }
  });
  ['pointerup','pointercancel','pointerleave'].forEach(t=>pad.addEventListener(t,()=>{dibujando=false;}));
  $('limpiar').addEventListener('click',()=>{ trazos=[]; hayTrazo=false; $('padEmpty').hidden=false; redibujar(); });
  window.addEventListener('resize',ajustar);
  requestAnimationFrame(ajustar);

  function firmaDataURL(){
    // recorta a los trazos, fondo blanco
    const r=pad.getBoundingClientRect(); const dpr=window.devicePixelRatio||1;
    const out=document.createElement('canvas'); out.width=pad.width; out.height=pad.height;
    const o=out.getContext('2d'); o.fillStyle='#fff'; o.fillRect(0,0,out.width,out.height); o.drawImage(pad,0,0);
    return out.toDataURL('image/png');
  }

  /* ---------- Envío ---------- */
  const nombre=$('nombre');
  nombre.addEventListener('input',()=>{nombre.removeAttribute('aria-invalid');$('nombreMsg').textContent='';});
  let registro=null;
  $('f').addEventListener('submit',e=>{
    e.preventDefault();
    const errs=[];
    const n=nombre.value.trim().replace(/\s+/g,' ');
    if(n.split(' ').length<2){ nombre.setAttribute('aria-invalid','true'); $('nombreMsg').textContent='Escriba nombre y al menos un apellido.'; errs.push('nombre'); }
    if(!rutValido(rut.value)){ rut.setAttribute('aria-invalid','true'); rutMsg.className='msg'; rutMsg.textContent='Ingrese un RUT válido, con dígito verificador.'; errs.push('RUT'); }
    if(!hayTrazo){ $('firmaMsg').textContent='Dibuje su firma en el recuadro.'; errs.push('firma'); }
    if(!$('acepto').checked){ errs.push('declaración de conformidad'); }
    const fe=$('formErr');
    if(errs.length){ fe.textContent='Falta completar: '+errs.join(', ')+'.'; fe.hidden=false; return; }
    fe.hidden=true;
    const ahora=new Date();
    registro={nombre:n, rut:formatearRut(rut.value), fecha:ahora.toLocaleString('es-CL',{dateStyle:'long',timeStyle:'short'}), firma:firmaDataURL()};
    $('sNombre').textContent=registro.nombre; $('sRut').textContent=registro.rut;
    $('sFecha').textContent=registro.fecha; $('sFirma').src=registro.firma;
    $('f').hidden=true; $('done').hidden=false;
  });
  $('editar').addEventListener('click',()=>{ $('done').hidden=true; $('f').hidden=false; });

  /* ---------- Comprobante descargable ---------- */
  $('descargar').hidden=false;
  function comprobante(){
    return new Promise(res=>{
      const W=1200,H=700,c=document.createElement('canvas'); c.width=W; c.height=H;
      const g=c.getContext('2d');
      g.fillStyle='#fff'; g.fillRect(0,0,W,H);
      g.fillStyle='#5B6675'; g.font='500 22px "IBM Plex Sans", sans-serif'; g.fillText('COMPROBANTE DE FIRMA',60,80);
      g.fillStyle='#1B2430'; g.font='600 40px "Source Serif 4", Georgia, serif'; g.fillText('Acuerdo de colaboración',60,135);
      g.strokeStyle='#CBD3DD'; g.beginPath(); g.moveTo(60,165); g.lineTo(W-60,165); g.stroke();
      const filas=[['Nombre',registro.nombre],['RUT',registro.rut],['Fecha',registro.fecha]];
      filas.forEach((f,i)=>{ const y=220+i*50; g.fillStyle='#5B6675'; g.font='400 24px "IBM Plex Sans", sans-serif'; g.fillText(f[0],60,y); g.fillStyle='#1B2430'; g.fillText(f[1],220,y); });
      const img=new Image(); img.onload=()=>{
        const bw=640, bh=bw*img.height/img.width;
        g.drawImage(img,60,380,bw,Math.min(bh,260));
        g.strokeStyle='#1B2430'; g.beginPath(); g.moveTo(60,650); g.lineTo(700,650); g.stroke();
        g.fillStyle='#5B6675'; g.font='400 20px "IBM Plex Sans", sans-serif'; g.fillText('Firma',60,680);
        c.toBlob(b=>res(b),'image/png');
      }; img.src=registro.firma;
    });
  }
  $('descargar').addEventListener('click',async()=>{
    if(!registro) return;
    const msg=$('dlMsg'); msg.className='msg'; msg.textContent='';
    try{
      const blob=await comprobante();
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='firma-'+registro.rut.replace(/\./g,'')+'.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      msg.className='msg good'; msg.textContent='Comprobante descargado.';
    }catch(err){ msg.textContent='No se pudo generar el comprobante.'; }
  });
})();
</script>

</body>
</html>
